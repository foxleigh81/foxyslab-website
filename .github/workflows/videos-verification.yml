name: Populated Videos Verification

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Draft PR number to verify
        required: true
        type: number
      expected_sha:
        description: Exact reviewed PR head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  videos:
    name: Credentialed Videos Build and Measurements
    if: github.ref == 'refs/heads/main'
    environment: videos-verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check approved head before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          test "$actual" = "$EXPECTED_SHA"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.expected_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Recheck exact head and run credentialed verification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          YOUTUBE_API_KEY: ${{ secrets.VIDEOS_VERIFY_YOUTUBE_API_KEY }}
          FOURTHWALL_STOREFRONT_TOKEN: ${{ secrets.VIDEOS_VERIFY_FOURTHWALL_STOREFRONT_TOKEN }}
          FLAGS_SECRET: ${{ secrets.VIDEOS_VERIFY_FLAGS_SECRET }}
          ALLOW_MISSING_API_KEYS: "false"
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          test "$actual" = "$EXPECTED_SHA"
          unset GH_TOKEN
          export CHROME_PATH="$(node -p 'require("@playwright/test").chromium.executablePath()')"
          npm run verify:videos

      - name: Retain minimal measurement evidence
        id: reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: videos-verification-${{ github.event.inputs.expected_sha }}
          path: .lighthouseci/videos/run-*/summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Link evidence
        if: always()
        env:
          HEAD_SHA: ${{ github.event.inputs.expected_sha }}
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          echo "### Videos verification: $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_URL" ]; then
            echo "[Numeric Lighthouse summaries]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No measurement summary produced; check the credential-safe stage diagnostics. Raw reports are not uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi
          for report in .lighthouseci/videos/run-*/summary.json; do
            if [ -f "$report" ]; then
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo '' >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
