name: Production Videos Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  videos:
    name: Build, Desktop/Mobile Gallery & Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify production videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FOURTHWALL_STOREFRONT_TOKEN: ${{ secrets.FOURTHWALL_STOREFRONT_TOKEN }}
          FLAGS_SECRET: ${{ secrets.FLAGS_SECRET }}
          NEXT_PUBLIC_SENTRY_DSN: ""
        run: |
          export CHROME_PATH="$(node -p 'require("@playwright/test").chromium.executablePath()')"
          npm run verify:videos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-verification
          path: .lighthouseci/videos/
          include-hidden-files: true
          retention-days: 14
